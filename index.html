<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AR Kelompok 5 - Minggu 2 (Scene v1)</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- MANAJEMEN ASET (Sesuai modul: memuat tekstur dari folder assets) -->
    <a-assets>
      <img id="teksturMobil" src="assets/tekstur.jpg">
    </a-assets>

    <!-- PENCAHAYAAN -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#EEEEEE" intensity="0.8" position="1 3 2"></a-light>

    <!-- MARKER HIRO -->
    <a-marker preset="hiro">

      <!-- 1. Alas: bidang datar transparan (diputar -90 derajat agar rebah) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="2" height="2" 
               color="#e9e5fa" opacity="0.7" transparent="true">
      </a-plane>

      <!-- 2. Kubus Warna Solid -->
      <a-box position="-0.6 0.25 0" width="0.5" height="0.5" depth="0.5" 
             color="#4C6BF5">
      </a-box>

      <!-- 3. Bola (material metalness & roughness) -->
      <a-sphere position="0 0.3 0" radius="0.3" 
                color="#D9531F" metalness="0.2" roughness="0.4">
      </a-sphere>

      <!-- 4. Silinder Animasi Rotasi -->
      <a-cylinder position="0.6 0.3 0" radius="0.2" height="0.6" color="#087F73"
                  animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
      </a-cylinder>

      <!-- 5. Kotak Bertekstur (Mengambil gambar dari folder assets) -->
      <a-box position="0 0.15 0.7" width="0.5" height="0.3" depth="0.5" 
             src="#teksturMobil">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
