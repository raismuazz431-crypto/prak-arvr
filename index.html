<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Textured Hologram - Kelompok AR</title>
  <!-- Library A-Frame & AR.js versi stabil -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ==================== MANAJEMEN ASET ==================== -->
    <a-assets>
      <!-- Memuat file gambar dari folder assets/ -->
      <img id="teksturSaya" src="assets/tekstur.jpg">
    </a-assets>

    <!-- ==================== PENCAHAYAAN ==================== -->
    <a-entity type="ambient" color="#ffffff" intensity="0.9"></a-entity>
    <a-entity type="directional" color="#00E5FF" intensity="1.2" position="-2 4 2"></a-entity>
    <a-entity type="directional" color="#FF007F" intensity="1.0" position="2 4 -2"></a-entity>

    <!-- ==================== MARKER HIRO ==================== -->
    <a-marker preset="hiro">

      <!-- 1. Alas Ring Hologram Berputar -->
      <a-ring position="0 0.05 0" rotation="-90 0 0" radius-inner="0.9" radius-outer="1.4" color="#00E5FF" opacity="0.8"
              animation="property: rotation; to: -90 0 360; loop: true; dur: 8000; easing: linear">
      </a-ring>
      
      <a-ring position="0 0.06 0" rotation="-90 0 0" radius-inner="0.4" radius-outer="0.8" color="#FF007F" opacity="0.6"
              animation="property: rotation; to: -90 0 -360; loop: true; dur: 5000; easing: linear">
      </a-ring>

      <!-- 2. OBJEK UTAMA: Kubus Tekstur (Menggunakan Aset Gambar) -->
      <!-- Kubus berputar, melayang (bounce), dan bernapas (pulse) -->
      <a-box position="0 1.0 0" 
             width="0.8" height="0.8" depth="0.8"
             src="#teksturSaya"
             animation__rotate="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"
             animation__float="property: position; to: 0 1.3 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine"
             animation__pulse="property: scale; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1000; easing: easeInOutQuad">
      </a-box>

      <!-- 3. Cincin Emas Orbit Mengelilingi Kubus Tekstur -->
      <a-torus position="0 1.15 0" 
               radius="0.85" radius-tubular="0.02" 
               color="#FFD700"
               animation="property: rotation; to: 360 360 0; loop: true; dur: 3000; easing: linear">
      </a-torus>

      <a-torus position="0 1.15 0" 
               radius="1.1" radius-tubular="0.015" 
               color="#FF007F"
               animation="property: rotation; to: -360 180 360; loop: true; dur: 5000; easing: linear">
      </a-torus>

      <!-- 4. Bola Inti Energi di Atas Kubus -->
      <a-sphere position="0 2.2 0" 
                radius="0.25" 
                color="#00FFCC"
                animation="property: position; to: 0 2.5 0; dir: alternate; loop: true; dur: 800; easing: easeInOutQuad">
      </a-sphere>

      <!-- 5. Kristal Piramida Pendukung di Kiri dan Kanan -->
      <a-tetrahedron position="-1.4 0.6 0" radius="0.35" color="#FF1744"
                     animation="property: rotation; to: 0 360 0; loop: true; dur: 2500; easing: linear">
      </a-tetrahedron>

      <a-tetrahedron position="1.4 0.6 0" radius="0.35" color="#00E5FF"
                     animation="property: rotation; to: 360 0 0; loop: true; dur: 2500; easing: linear">
      </a-tetrahedron>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
