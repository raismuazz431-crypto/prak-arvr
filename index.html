<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Rais-Praktikum</title>
  <!-- Library A-Frame & AR.js versi stabil -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- ==================== MANAJEMEN ASET ==================== -->
    <a-assets>
      <img id="teksturMobil" src="assets/tekstur.jpg">
    </a-assets>

    <!-- ==================== PENCAHAYAAN ==================== -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" color="#EEEEEE" intensity="0.8" position="1 3 2"></a-light>

    <!-- ==================== MARKER HIRO ==================== -->
    <a-marker preset="hiro">

      <!-- 1. Alas Bidang Datar Transparan -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="2.2" height="2.2" 
               color="#e9e5fa" opacity="0.7" transparent="true">
      </a-plane>

      <!-- 2. Objek Kubus Bertekstur Mobil (DIAM / TANPA ANIMASI) -->
      <a-box position="-0.7 0.3 0" width="0.5" height="0.5" depth="0.5" 
             src="#teksturMobil">
      </a-box>

      <!-- 3. Objek Bulat/Bola (Memantul Naik-Turun) -->
      <a-sphere position="-0.2 0.3 0" radius="0.22" 
                color="#D9531F" metalness="0.2" roughness="0.4"
                animation="property: position; to: -0.2 0.7 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutQuad">
      </a-sphere>

      <!-- 4. Objek Telur (Lonjong Vertikal & Animasi Bernapas/Pulse) -->
      <a-sphere position="0.3 0.35 0" radius="0.2" scale="1 1.4 1"
                color="#FFC107" metalness="0.1" roughness="0.5"
                animation="property: scale; to: 1.1 1.6 1.1; dir: alternate; dur: 800; loop: true; easing: easeInOutSine">
      </a-sphere>

      <!-- 5. Objek Cincin / Torus (Berputar) -->
      <a-torus position="0.8 0.3 0" radius="0.18" radius-tubular="0.05"
               color="#087F73"
               animation="property: rotation; to: 360 360 0; dur: 3500; loop: true; easing: linear">
      </a-torus>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

  </a-scene>
</body>
</html>
