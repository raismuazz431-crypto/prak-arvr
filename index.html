<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum AR - Kelompok Geng Bebas</title>
  <!-- Library A-Frame dan AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Pencahayaan (Lighting) agar objek terlihat lebih dramatis -->
    <a-entity type="ambient" color="#ffffff" intensity="0.9"></a-entity>
    <a-entity type="directional" color="#ffffff" intensity="0.8" position="-1 4 2"></a-entity>

    <!-- Marker Hiro AR -->
    <a-marker preset="hiro">

      <!-- Objek 1: Kotak Cyan Neon dengan Efek Membesar-Mengecil (Pulse) -->
      <a-box id="kotak-biru" 
             position="-1.2 0.5 0" 
             depth="0.8" height="0.8" width="0.8" 
             color="#00E5FF"
             animation="property: scale; to: 1.25 1.25 1.25; dir: alternate; loop: true; dur: 900; easing: easeInOutSine">
      </a-box>

      <!-- Objek 2: Bola Merah Delima dengan Efek Memantul Naik-Turun (Bounce) -->
      <a-sphere id="bola-merah" 
                position="0 0.6 0" 
                radius="0.5" 
                color="#FF1744"
                animation="property: position; to: 0 1.5 0; dir: alternate; loop: true; dur: 1000; easing: easeInOutQuad">
      </a-sphere>

      <!-- Objek 3: Silinder Emas Berputar 3D (3D Spin) -->
      <a-cylinder id="silinder-berputar" 
                  position="1.2 0.6 0" 
                  radius="0.35" height="1.0" 
                  color="#FFD700"
                  animation="property: rotation; to: 360 360 0; loop: true; dur: 2500; easing: linear">
      </a-cylinder>

      <!-- Objek 4: Kotak Tekstur Diperbesar Melayang & Berputar Pelan -->
      <a-box id="kotak-bertekstur" 
             position="0 0.5 1.2" 
             width="1.1" height="0.7" depth="1.1" 
             src="assets/tekstur.jpg"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
      </a-box>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
