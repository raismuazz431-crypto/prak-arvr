<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Futuristik - Kelompok AR</title>
  <!-- CDN Stabil A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-entity type="ambient" color="#ffffff" intensity="0.8"></a-entity>
    <a-entity type="directional" color="#00ffff" intensity="1.0" position="-1 4 2"></a-entity>

    <a-marker preset="hiro">

      <!-- Objek Kubus Neon Berputar & Membesar -->
      <a-box position="0 0.5 0" 
             color="#00E5FF" 
             depth="0.8" height="0.8" width="0.8"
             animation__rot="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear"
             animation__pulse="property: scale; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000; easing: easeInOutSine">
      </a-box>

      <!-- Bola Merah Memantul Di Atas Kubus -->
      <a-sphere position="0 1.5 0" 
                radius="0.3" 
                color="#FF1744"
                animation="property: position; to: 0 2.0 0; dir: alternate; loop: true; dur: 800; easing: easeInOutQuad">
      </a-sphere>

      <!-- Cincin Emas Berputar Mengelilingi Kubus -->
      <a-torus position="0 0.5 0" 
               radius="0.8" radius-tubular="0.02" 
               color="#FFD700"
               animation="property: rotation; to: 360 360 0; loop: true; dur: 2500; easing: linear">
      </a-torus>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
